# Tests the code, builds the app image for amd64 and arm64 on native runners with the
# published Nautilus wheel, runs the offline engine checks inside each image and
# publishes ghcr.io/<owner>/pine-strategy-runner (latest, commit, and vX.Y.Z on tags).
name: Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A new Nautilus wheel image republishes the app on top of it.
  workflow_run:
    workflows: [Nautilus wheel]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  WHEEL_IMAGE: ghcr.io/${{ github.repository }}-nautilus

jobs:
  test:
    if: >-
      github.repository == 'solovit12/pine-strategy-runner'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run

  # The very first push runs before the wheel image exists; the app is then built
  # when the Nautilus wheel workflow completes.
  wheel:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.check.outputs.image }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("apps/nautilus-paper/patches/hyperliquid-fast5/manifest.json"))["candidateVersion"].replace("+", "-"))')
          echo "image=$WHEEL_IMAGE:$tag" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$WHEEL_IMAGE:$tag" > /dev/null 2>&1; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Wheel image $WHEEL_IMAGE:$tag is not published yet; the app builds after the Nautilus wheel workflow."; fi

  build:
    needs: wheel
    if: needs.wheel.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          build-args: |
            NAUTILUS_WHEEL=prebuilt
            NAUTILUS_WHEEL_IMAGE=${{ needs.wheel.outputs.image }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
      - name: Engine checks inside the image
        run: |
          docker run --rm --user root -e PSR_NAUTILUS_PYTHON=/opt/venv/bin/python -w /app/apps/nautilus-paper \
            "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" sh -ec '
              for t in test_pine_orders.py test_sdk_runner.py test_data_bridge_markets.py test_diagnostics.py \
                       test_fast_book_config.py test_recovery_policy.py test_pine_runtime.py test_pine_recovery.py \
                       test_lifecycle.py test_sdk_runtime.py; do
                echo "== $t"; /opt/venv/bin/python "$t"
              done'
      - name: Site answers
        run: |
          docker run -d --name psr -p 127.0.0.1:18788:8787 "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18788/api/health && exit 0; sleep 2; done
          docker logs psr; exit 1
      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags for both architectures
        run: |
          tags=(-t "$IMAGE:${{ github.sha }}")
          if [ "${{ github.ref_type }}" = tag ]; then tags+=(-t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest"); fi
          if [ "${{ github.ref }}" = refs/heads/main ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
