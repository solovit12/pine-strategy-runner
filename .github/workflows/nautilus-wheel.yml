# Builds the Nautilus Trader wheel (pinned source + Hyperliquid fast-book patch) for
# amd64 and arm64 on native runners and publishes it as a small image that only holds
# /wheels. Runs only when the recipe changes; the app image reuses it.
name: Nautilus wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/nautilus-paper/patches/hyperliquid-fast5/**
      - .github/workflows/nautilus-wheel.yml

permissions:
  contents: read
  packages: write

env:
  # Keeps the name it was first published under (before the rename to Svit Runner).
  WHEEL_IMAGE: ghcr.io/${{ github.repository_owner }}/pine-strategy-runner-nautilus

jobs:
  build:
    if: github.repository == 'solovit12/svit-runner'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("apps/nautilus-paper/patches/hyperliquid-fast5/manifest.json"))["candidateVersion"].replace("+", "-"))')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: nautilus-wheel-image
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.WHEEL_IMAGE }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        run: |
          tag=${{ needs.build.outputs.tag }}
          docker buildx imagetools create -t "$WHEEL_IMAGE:$tag" "$WHEEL_IMAGE:$tag-amd64" "$WHEEL_IMAGE:$tag-arm64"
