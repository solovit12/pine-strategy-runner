# Svit Runner. The project name stays "pine-strategy-runner": it names the data volume of earlier installs.
name: pine-strategy-runner

# Start:  docker compose up -d        then open http://127.0.0.1:18788
# Update: docker compose pull && docker compose up -d
services:
  psr:
    image: ghcr.io/solovit12/svit-runner:latest
    ports:
      - "127.0.0.1:18788:8787"
    environment:
      # Your Python strategies: every .py file in ./my_strategies (README: Python strategies).
      PSR_STRATEGY_PACKS: /strategies/my_strategies
    volumes:
      - psr-data:/data
      - ./my_strategies:/strategies/my_strategies:ro
    init: true
    restart: unless-stopped
    # A stop closes every Paper run cleanly; their virtual accounts stay in the history.
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true

volumes:
  psr-data:
